name: Windows GUI
run-name: ${{ inputs.verify_mediax && 'Windows GUI + MediaX verification' || 'Windows GUI build' }}
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_mediax:
        description: Test the installed KANALI encoder on the Windows runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      KANALI_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build embedded ENE RAM helper
        shell: pwsh
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build --release --target i686-pc-windows-msvc --manifest-path ene-helper/Cargo.toml
          "KANALI_ENE_HELPER=$pwd/ene-helper/target/i686-pc-windows-msvc/release/kanali-ene-helper.exe" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --lib --bin kanali
      - run: cargo test --locked --bin kanali windows_capture_tool_encodes_visible_device_clip -- --ignored
      - run: cargo build --locked --release --bin kanali
      - id: package
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "version=$version" >> $env:GITHUB_OUTPUT
          Copy-Item target/release/kanali.exe kanali-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: kanali-windows-x64-v${{ steps.package.outputs.version }}
          path: kanali-windows-x64.exe
          if-no-files-found: error
      - name: Restore verified KANALI archive
        id: vendor-cache
        if: inputs.verify_mediax
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kanali-original.zip
          key: kanali-original-b9b0df3629b15aef1ed48662b2b7aa8c6bc778fc59e87cc6c8e059fdbc993fa2
      - name: Download KANALI test archive
        if: inputs.verify_mediax && steps.vendor-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'kanali-original.zip'
          $url = 'https://static.tryxzone.com/KANALI_V2.7.0_20261110.zip'
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            curl.exe -4 --fail --location --silent --show-error --connect-timeout 60 --speed-time 90 --speed-limit 1024 --continue-at - --referer https://www.tryxzone.com/en/software/ --output $zip $url
            $result = $LASTEXITCODE
            if ($result -eq 0) { break }
            if ($attempt -eq 5) { throw "KANALI download failed (curl exit $result)" }
            Write-Warning "Download interrupted (curl exit $result). Resuming on attempt $($attempt + 1)."
            Start-Sleep -Seconds 5
          }
          if ((Get-FileHash $zip).Hash -ne 'b9b0df3629b15aef1ed48662b2b7aa8c6bc778fc59e87cc6c8e059fdbc993fa2') { throw 'Original KANALI archive SHA-256 mismatch' }
      - name: Cache verified KANALI archive
        if: inputs.verify_mediax && steps.vendor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kanali-original.zip
          key: kanali-original-b9b0df3629b15aef1ed48662b2b7aa8c6bc778fc59e87cc6c8e059fdbc993fa2
      - name: Verify native KANALI conversion
        if: inputs.verify_mediax
        timeout-minutes: 12
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'kanali-original.zip'
          if ((Get-FileHash $zip).Hash -ne 'b9b0df3629b15aef1ed48662b2b7aa8c6bc778fc59e87cc6c8e059fdbc993fa2') { throw 'Original KANALI archive SHA-256 mismatch' }
          $dir = Join-Path $env:RUNNER_TEMP 'kanali-original'
          Expand-Archive $zip $dir
          $installer = (Get-ChildItem $dir -Filter '*.exe' -Recurse | Select-Object -First 1).FullName
          python .github/scripts/mediax_fixture.py $installer "$env:LOCALAPPDATA/Programs/KANALI"
          if ($LASTEXITCODE -ne 0) { throw 'Extracting the MediaX fixture failed' }
          cargo test --locked --bin kanali native_mediax_converts_video -- --ignored
