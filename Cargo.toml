[package]
name = "kanali-rs"
version = "0.2.29"
default-run = "kanali"
edition = "2021"
description = "Điều khiển màn hình Tryx Panorama: nhẹ RAM, có giao diện và tự cập nhật"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:tao", "dep:tray-icon"]

[lib]
name = "kanali_rs"
path = "src/lib.rs"

# Công cụ dòng lệnh (có console)
[[bin]]
name = "kanali-rs"
path = "src/cli.rs"

# Ứng dụng chính: khay hệ thống + giao diện
[[bin]]
name = "kanali"
path = "src/app/main.rs"
required-features = ["gui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json"] }
sha2 = "0.10"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"], optional = true }
tao = { version = "0.30", optional = true }
tray-icon = { version = "0.19", optional = true }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
wry = { version = "0.46", default-features = false }
url = "2"
libloading = "0.8"
steamlocate = "2"
wmi = { version = "0.14", default-features = false }
nvml-wrapper = "0.10"
image = {version = "0.25", default-features = false, features = ["png","jpeg","webp","gif"]}

[dependencies.windows]
version = "0.58"
features = ["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_UI_Input_KeyboardAndMouse","Win32_UI_Shell","Win32_System_SystemInformation","Win32_System_Threading", "Win32_System_IO", "Win32_Devices_DeviceAndDriverInstallation"]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
